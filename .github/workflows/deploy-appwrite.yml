name: Deploy to Appwrite Sites

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site (Vite)
        env:
          # Build-time flags (adjust if needed by app)
          VITE_ENABLE_LEGACY_API: "false"
        run: npm run build

      - name: Create deployment archive (from dist)
        run: |
          set -x
          test -d dist || { echo "dist not found. Build likely failed"; exit 1; }
          # Package the built static assets so index.html sits at archive root
          tar -czf code.tar.gz -C dist . || true
          (cd dist && zip -r ../code.zip .) || true
          ls -lh code.* || true

      - name: Deploy to Appwrite Sites
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_SITE_ID: ${{ secrets.APPWRITE_SITE_ID }}
        run: |
          set -x
          APPWRITE_ENDPOINT="https://nyc.cloud.appwrite.io/v1"
          APPWRITE_PROJECT_ID="6897443a0034c54b3fd8"
          FILE="code.zip"
          if [ ! -s "$FILE" ]; then
            FILE="code.tar.gz"
          fi
          ls -lh "$FILE" || { echo "Archive missing"; exit 1; }
          curl -fsS -X POST "$APPWRITE_ENDPOINT/sites/$APPWRITE_SITE_ID/deployments" \
            -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            -H "X-Appwrite-Key: $APPWRITE_API_KEY" \
            -F "code=@${FILE}" \
            -F "activate=true"


