name: Deploy to Firebase Hosting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Build-time env for Vite - Firebase Configuration
      VITE_BACKEND_PROVIDER: firebase
      VITE_FIREBASE_PROJECT_ID: jusivo
      VITE_FIREBASE_API_KEY: AIzaSyAb45jjLqzrnRYnqc5WlYvvKwYHZhxoU8g
      VITE_FIREBASE_AUTH_DOMAIN: jusivo.firebaseapp.com
      VITE_FIREBASE_DATABASE_URL: ""
      VITE_FIREBASE_STORAGE_BUCKET: jusivo.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "829325582202"
      VITE_FIREBASE_APP_ID: "1:829325582202:web:07b6036fa03e2df73f40c3"
      VITE_FIREBASE_MEASUREMENT_ID: "G-1L2R9BGTM1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (production)
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️ FIREBASE_TOKEN secret not found. Skipping Firebase deployment."
            echo "📝 To enable Firebase deployment, add FIREBASE_TOKEN secret to repository."
            echo "🔗 Instructions: https://firebase.google.com/docs/cli#cli-ci-systems"
            exit 0
          fi
          echo "🚀 Deploying to Firebase Hosting..."
          npx firebase-tools deploy --only hosting --project jusivo --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  preview:
    name: Build and Preview (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Build-time env for Vite - Firebase Configuration (Preview)
      VITE_BACKEND_PROVIDER: firebase
      VITE_FIREBASE_PROJECT_ID: jusivo
      VITE_FIREBASE_API_KEY: AIzaSyAb45jjLqzrnRYnqc5WlYvvKwYHZhxoU8g
      VITE_FIREBASE_AUTH_DOMAIN: jusivo.firebaseapp.com
      VITE_FIREBASE_DATABASE_URL: ""
      VITE_FIREBASE_STORAGE_BUCKET: jusivo.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "829325582202"
      VITE_FIREBASE_APP_ID: "1:829325582202:web:07b6036fa03e2df73f40c3"
      VITE_FIREBASE_MEASUREMENT_ID: "G-1L2R9BGTM1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy preview channel
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️ FIREBASE_TOKEN secret not found. Skipping Firebase preview deployment."
            echo "📝 To enable Firebase deployment, add FIREBASE_TOKEN secret to repository."
            exit 0
          fi
          echo "🚀 Deploying preview to Firebase Hosting..."
          npx firebase-tools hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project jusivo --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}


